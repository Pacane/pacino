# Pacino firmware options. Uncomment as needed.

# Deep sleep after 15 min idle (big battery saver on the 500 mAh cell). Waking from it means a keypress and a
# few seconds' reconnect; with the 2000 mAh cell you can afford to turn it off (CONFIG_ZMK_SLEEP=n, flash both halves)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Uncomment when building the nice!view variant
# CONFIG_ZMK_DISPLAY=y
